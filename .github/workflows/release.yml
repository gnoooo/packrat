name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check lockfile
        run: uv lock --check

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run --frozen pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Compute release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          SHORT="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            case "$VERSION" in
              "$BASE"|"$BASE".*|"$BASE"-*|"$BASE"rc*|"$BASE"a*|"$BASE"b*) ;;
              *)
                echo "tag version $VERSION does not match pyproject $BASE" >&2
                exit 1
                ;;
            esac
            case "$VERSION" in
              *.dev*|*-*|*rc[0-9]*|*a[0-9]*|*b[0-9]*) PRERELEASE="--prerelease" ;;
              *) PRERELEASE="" ;;
            esac
          else
            TAG="v${BASE}"
            STABLE=0
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
                STABLE=1
              elif [ "$(git rev-parse "refs/tags/${TAG}")" = "${GITHUB_SHA}" ]; then
                STABLE=1
              fi
            fi
            if [ "${STABLE}" = "1" ]; then
              VERSION="${BASE}"
              PRERELEASE=""
            else
              VERSION="${BASE}.dev${GITHUB_RUN_NUMBER}+${SHORT}"
              PRERELEASE="--prerelease"
            fi
            TAG="v${VERSION}"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG}"

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ steps.version.outputs.version }}" <<'PY'
          import pathlib
          import re
          import sys
          version = sys.argv[1]
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = re.sub(r'^version = ".*"$', f'version = "{version}"', text, count=1, flags=re.M)
          path.write_text(text, encoding="utf-8")
          PY
          uv lock
          mkdir -p dist
          uv export --format requirements.txt --no-dev --no-emit-project --output-file dist/requirements.lock
          uv build --out-dir dist
          git checkout -- pyproject.toml uv.lock

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum packrat-*.whl packrat-*.tar.gz requirements.lock > SHA256SUMS
          ls -l

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: dist/*

      - name: Create tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            [ "$(git rev-parse "refs/tags/${TAG}")" = "${GITHUB_SHA}" ] || {
              echo "tag ${TAG} already exists at another commit" >&2
              exit 1
            }
          else
            git tag "$TAG"
          fi
          git push origin "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" dist/* \
            --title "Packrat ${{ steps.version.outputs.version }}" \
            --generate-notes \
            ${{ steps.version.outputs.prerelease }}
