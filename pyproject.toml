[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "packrat"
version = "0.3.4"
description = "Download music from YouTube Music for offline use."
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi==1.12.3",
    "yt-dlp[default]==2026.10.26",
    "mutagen==1.48.1",
    "packaging==26.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
packrat = "packrat.cli:main"
ytm-offline = "packrat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/packrat"]
